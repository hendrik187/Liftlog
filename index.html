<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101512"><meta name="application-name" content="CFTS"><link rel="manifest" href="./manifest.webmanifest">
<title>CFTS – Cool for the Summer</title>
<style>
:root{color-scheme:dark;--bg:#101512;--panel:#19221c;--panel2:#202c24;--line:#304237;--green:#8ac49a;--muted:#aab8ad;--red:#e28b82}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f2f6f2;font:15px system-ui;padding-bottom:82px}header{padding:20px 18px 14px;position:sticky;top:0;background:#101512ed;z-index:5;border-bottom:1px solid var(--line)}h1{font-size:25px;margin:0}header p{margin:3px 0 0;color:var(--muted);font-size:13px}.wrap{max-width:760px;margin:auto;padding:15px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#172019;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:8}.tabs button{background:none;border:0;color:var(--muted);font-size:12px;padding:7px}.tabs button.active{color:var(--green)}button{border:1px solid var(--line);background:var(--panel2);color:#f4f7f4;border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer}button.primary{background:var(--green);color:#102016;border:0;font-weight:700}button.danger{color:var(--red)}button:disabled{opacity:.4}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:11px 0}.row,.between,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.actions{margin-top:12px}.muted,small{color:var(--muted)}h2{font-size:20px;margin:5px 0 12px}h3{font-size:16px;margin:0 0 8px}.field{display:grid;gap:5px;margin:10px 0}label{font-size:13px;color:var(--muted)}input,select{width:100%;min-width:0;background:#0e1511;color:#f2f6f2;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{font-size:25px;font-weight:700}.pill{font-size:12px;color:var(--green);background:#24382a;border-radius:30px;padding:4px 8px}.empty{text-align:center;padding:24px;color:var(--muted)}.exercise{border-top:1px solid var(--line);padding:12px 0}.setrow{display:grid;grid-template-columns:28px 1fr 1fr 36px 36px 26px;gap:5px;align-items:center;margin:7px 0}.setrow input{padding:8px 2px;text-align:center}.setrow button{padding:7px 0}.setrow input[type=checkbox]{width:18px;height:18px}.modal{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}.modal.hidden{display:none}.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;width:min(760px,100%);max-height:92vh;overflow:auto;padding:17px 15px calc(22px + env(safe-area-inset-bottom))}.sheethead{display:flex;justify-content:space-between;align-items:center}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{padding:8px 1px;text-align:center;border-radius:8px;background:var(--panel);font-size:12px;min-height:43px}.day.has{outline:1px solid var(--green)}.day.today{background:#294332}.hidden{display:none!important}

.exercise-tools{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.setrow{grid-template-columns:22px minmax(0,1fr) 30px 30px minmax(0,1fr) 30px 30px 22px;gap:4px}
@media(max-width:390px){.setrow{grid-template-columns:18px minmax(0,1fr) 25px 25px minmax(0,1fr) 25px 25px 18px;gap:3px}.setrow button{font-size:12px;padding:6px 0}}
.history-setrow{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr);gap:5px}.history-setlabels{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr);gap:5px;font-size:11px;color:var(--muted)}
.setrow .mini{padding:6px 0;font-size:13px}
.setlabels{display:grid;grid-template-columns:22px minmax(0,1fr) 30px 30px minmax(0,1fr) 30px 30px 22px;gap:4px;font-size:11px;color:var(--muted);align-items:end}.setlabels .weight-label{grid-column:2/5}.setlabels .reps-label{grid-column:5/8}.setlabels .done-label{text-align:center}@media(max-width:390px){.setlabels{grid-template-columns:18px minmax(0,1fr) 25px 25px minmax(0,1fr) 25px 25px 18px;gap:3px;font-size:10px}}
.group-title{margin:16px 0 7px;color:var(--green);font-size:14px}
.exercise-option{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.exercise-option button{padding:7px 10px}
.day{cursor:pointer}.day.selected{background:#355640;outline:2px solid var(--green);font-weight:700}
.day.dragover{outline:2px dashed var(--green)}
.plan-drag{cursor:grab}.plan-drag:active{cursor:grabbing}
.chart-wrap{height:270px;position:relative;margin:14px 0 8px;padding:8px 0}.chart-wrap canvas{width:100%;height:100%;display:block}.chart-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.chart-stat{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px}.chart-stat strong{display:block;font-size:20px;margin-top:3px}.chart-stat span{font-size:11px;color:var(--muted)}.calendar-tools{display:flex;gap:8px;align-items:center}.day{border:1px solid transparent;width:100%;font:inherit;color:inherit;cursor:pointer}.day:focus-visible{outline:2px solid var(--green)}.day.other-month{opacity:.35}
.metric{font-size:12px;color:var(--muted)}
.smallbtn{padding:6px 9px;font-size:13px}

</style></head>
<body>
<header><h1>CFTS</h1><p>Cool for the Summer</p></header>
<main class="wrap" id="app"></main>
<nav class="tabs"><button data-tab="home" class="active">⌂<br>Start</button><button data-tab="plans">＋<br>Training</button><button data-tab="calendar">▦<br>Kalender</button><button data-tab="stats">↗<br>Fortschritt</button></nav>
<div id="modal" class="modal hidden"><div class="sheet"><div class="sheethead"><h2 id="mtitle">CFTS</h2><button data-close>✕</button></div><div id="mbody"></div></div></div>
<script>

const KEY='liftlog_data_v2';
const BACKUP_KEY='cfts_auto_backups_v1';
const MAX_AUTO_BACKUPS=7;
const fresh=()=>({planned:[],history:[],templates:[],bodyweight:[]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{db=fresh()}
for(const k of ['planned','history','templates','bodyweight'])if(!Array.isArray(db[k]))db[k]=[];
const save=()=>{
  const serialized=JSON.stringify(db);
  localStorage.setItem(KEY,serialized);
  try{
    let backups=JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]');
    if(!Array.isArray(backups))backups=[];
    if(backups[0]?.data!==serialized){
      backups.unshift({createdAt:new Date().toISOString(),data:serialized});
      backups=backups.slice(0,MAX_AUTO_BACKUPS);
      localStorage.setItem(BACKUP_KEY,JSON.stringify(backups));
    }
  }catch(err){console.warn('Automatisches lokales Backup konnte nicht gespeichert werden.',err)}
}, $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab='home',month=new Date(),active=null,editingPlan=null,planDraft=[],selectedDay=new Date().toISOString().slice(0,10),chartExercise='';
const catalog={
 'Brust':['Brustpresse Maschine','Bankdrücken Langhantel','Bankdrücken Kurzhantel','Schrägbankdrücken Langhantel','Schrägbankdrücken Kurzhantel','Negativbankdrücken Langhantel','Butterfly Maschine','Cable Flys','Liegestütze'],
 'Rücken':['Latzug breit','Latzug eng','Latzug neutral','Klimmzüge','Klimmzüge assistiert','Rudern Maschine','Rudern Kabel sitzend','Rudern Kabel einarmig','Langhantelrudern','Kurzhantelrudern einarmig','Chest-Supported Row','Straight-Arm Pulldown'],
 'Schultern':['Schulterdrücken Maschine','Schulterdrücken Kurzhantel','Schulterdrücken Langhantel','Seitheben Kurzhantel','Seitheben Kabel einarmig','Seitheben Maschine','Reverse Fly Maschine','Face Pulls'],
 'Beine':['Kniebeugen Langhantel','Beinpresse','Hackenschmidt-Kniebeuge','Beinstrecker','Beinbeuger sitzend','Beinbeuger liegend','Rumänisches Kreuzheben','Kreuzheben','Ausfallschritte','Bulgarian Split Squats','Wadenheben stehend','Wadenheben sitzend'],
 'Bizeps':['Bizepscurls Kurzhantel','Hammercurls','Bizepscurls Langhantel','Scott-Curls Maschine','Kabelcurls','Kabelcurls einarmig'],
 'Trizeps':['Trizepsdrücken Kabel Seil','Trizepsdrücken Kabel Stange','Trizepsdrücken einarmig','Überkopf-Trizepsstrecken Kabel','French Press Langhantel','Trizeps Maschine'],
 'Bauch':['Crunches','Cable Crunches','Beinheben','Plank','Abdominal Maschine'],
 'Gesäß':['Hip Thrust','Glute Bridge','Kickbacks Kabel','Abduktoren Maschine','Adduktoren Maschine']
};
const typeFor=n=>/Langhantel/.test(n)?'Langhantel':/Kurzhantel/.test(n)?'Kurzhantel':/Kabel|Cable|Pulldown|Face Pull/.test(n)?'Kabel':/Klimmzüge|Liegestütze|Plank|Beinheben/.test(n)?'Körpergewicht':'Maschine';
const step=e=>e.type==='Maschine'||e.type==='Kabel'?5:e.type==='Langhantel'?2.5:e.type==='Körpergewicht'?1:2;
const newEx=(name,type)=>({name,type,sets:[{weight:0,reps:10,done:false},{weight:0,reps:10,done:false},{weight:0,reps:10,done:false}]});
function modal(t,html){$('#mtitle').textContent=t;$('#mbody').innerHTML=html;$('#modal').classList.remove('hidden')}
function close(){ $('#modal').classList.add('hidden');$('#mbody').innerHTML='';active=null }
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let a=$('#app');if(tab==='home')home(a);if(tab==='plans')plans(a);if(tab==='calendar')calendar(a);if(tab==='stats')stats(a)}
function planCard(p){return `<div class="card plan-drag" draggable="true" data-dragplan="${p.id}"><div class="between"><div><b>${esc(p.name)}</b><div class="muted">${p.date} · ${p.exercises.length} Übungen ${p.series?'· Serie':''}</div></div><span class="pill">Geplant</span></div><div class="actions"><button data-edit="${p.id}">Bearbeiten</button><button class="primary" data-start="${p.id}">Starten</button></div></div>`}
function home(a){let today=new Date().toISOString().slice(0,10),tod=db.planned.filter(p=>p.date===today),hist=[...db.history].sort((x,y)=>y.date.localeCompare(x.date)).slice(0,3);a.innerHTML=`<h2>Willkommen bei CFTS</h2><div class="grid"><div class="card"><div class="muted">Trainings absolviert</div><div class="stat">${db.history.length}</div></div><div class="card"><div class="muted">Geplant</div><div class="stat">${db.planned.length}</div></div></div><div class="between"><h2>Heute</h2><button class="primary" data-new>＋ Planen</button></div>${tod.length?tod.map(planCard).join(''):'<div class="card empty">Heute ist kein Training geplant.</div>'}<h2>Zuletzt abgeschlossen</h2>${hist.length?hist.map(h=>`<div class="card between"><div><b>${esc(h.name)}</b><div class="muted">${h.date}</div></div><button data-history="${h.id}">Bearbeiten</button></div>`).join(''):'<div class="card empty">Hier erscheinen deine abgeschlossenen Trainings.</div>'}<div class="actions"><button data-export>Daten exportieren</button><button data-import>Backup importieren</button></div><div class="card"><div class="between"><h3>Datensicherung</h3><span class="pill">Automatisch aktiv</span></div><p class="muted">CFTS legt bei gespeicherten Änderungen automatisch bis zu 7 lokale Sicherungsstände an. Zusätzlich kannst du jederzeit eine Datei exportieren.</p><div class="actions"><button class="primary" data-backup-now>Backup jetzt herunterladen</button><button data-restore-backup>Lokales Backup wiederherstellen</button></div><p class="metric">Lokale Backups liegen nur in diesem Browser auf diesem Gerät. Für Handywechsel oder bei gelöschten Browserdaten brauchst du zusätzlich einen extern gespeicherten Export.</p></div>`}
function plans(a){a.innerHTML=`<div class="between"><h2>Trainingsplanung</h2><button class="primary" data-new>＋ Neu</button></div>${db.planned.length?[...db.planned].sort((x,y)=>x.date.localeCompare(y.date)).map(planCard).join(''):'<div class="card empty">Noch keine Trainings geplant.</div>'}`}
function dayEntries(dt){return [...db.planned.filter(p=>p.date===dt).map(x=>({...x,status:'Geplant'})),...db.history.filter(h=>h.date===dt).map(x=>({...x,status:'Abgeschlossen'}))]}
function calendar(a){
  const y=month.getFullYear(),m=month.getMonth();
  const offset=(new Date(y,m,1).getDay()+6)%7;
  const n=new Date(y,m+1,0).getDate();
  const today=new Date().toISOString().slice(0,10);
  const cells=Array(offset).fill('<div class="day muted" aria-hidden="true"></div>');
  for(let d=1;d<=n;d++){
    const dt=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=db.planned.some(p=>p.date===dt)||db.history.some(h=>h.date===dt);
    cells.push(`<button type="button" class="day ${has?'has':''} ${dt===today?'today':''} ${dt===selectedDay?'selected':''}" data-day="${dt}" data-dropday="${dt}" aria-label="${d}. ${month.toLocaleDateString('de-DE',{month:'long'})}${has?', Training vorhanden':''}" aria-pressed="${dt===selectedDay}">${d}${has?'<br>●':''}</button>`);
  }
  const entries=dayEntries(selectedDay);
  a.innerHTML=`<div class="between"><div class="calendar-tools"><button aria-label="Vorheriger Monat" data-month="-1">‹</button><h2>${month.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</h2><button aria-label="Nächster Monat" data-month="1">›</button></div><button class="smallbtn" data-today>Heute</button></div><div class="calendar">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div class="day muted">${x}</div>`).join('')}${cells.join('')}</div><div class="between" style="margin-top:18px"><div><h3>${new Date(selectedDay+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h3><div class="metric">${entries.length} ${entries.length===1?'Training':'Trainings'}</div></div><button class="smallbtn" data-newday="${selectedDay}">＋ Planen</button></div>${entries.map(x=>`<div class="card"><div class="between"><div><b>${esc(x.name)}</b><div class="muted">${x.status} · ${x.exercises.length} Übungen</div></div><button ${x.status==='Geplant'?`data-edit="${x.id}"`:`data-history="${x.id}"`}>Öffnen</button></div>${x.status==='Geplant'?`<div class="actions"><button class="smallbtn" data-move="${x.id}">Datum ändern</button><button class="smallbtn danger" data-delete="${x.id}">Löschen</button></div>`:''}</div>`).join('')||'<div class="card empty">An diesem Tag ist nichts eingetragen. Du kannst hier ein Training planen.</div>'}<p class="metric">Jeder Tag ist direkt auswählbar. Vergangene Trainings lassen sich öffnen und bearbeiten; geplante Einheiten können ebenfalls geändert oder verschoben werden.</p>`;
}
function epley(weight,reps){return weight>0&&reps>0?weight*(1+reps/30):0}
function stats(a){
  const all=db.history.flatMap(h=>h.exercises.map(e=>e.name));
  const names=[...new Set(all)].sort();
  const sets=db.history.reduce((n,h)=>n+h.exercises.reduce((m,e)=>m+e.sets.length,0),0);
  if(!names.includes(chartExercise))chartExercise=names[0]||'';
  const best=names.map(n=>{const vals=db.history.flatMap(h=>h.exercises.filter(e=>e.name===n).flatMap(e=>e.sets.map(s=>epley(+s.weight,+s.reps))));return {n,v:Math.max(0,...vals)}}).filter(x=>x.v>0).sort((x,y)=>y.v-x.v);
  const selected=db.history.slice().sort((x,y)=>x.date.localeCompare(y.date)).map(h=>({date:h.date,v:Math.max(0,...h.exercises.filter(e=>e.name===chartExercise).flatMap(e=>e.sets.map(s=>epley(+s.weight,+s.reps))))})).filter(x=>x.v>0);
  const latest=selected.at(-1)?.v||0,record=Math.max(0,...selected.map(x=>x.v));
  a.innerHTML=`<h2>Fortschritt</h2><div class="grid"><div class="card"><div class="muted">Trainings</div><div class="stat">${db.history.length}</div></div><div class="card"><div class="muted">Sätze gesamt</div><div class="stat">${sets}</div></div></div><div class="card"><div class="between"><h3>Trainingsentwicklung</h3><span class="pill">${selected.length} Einheiten</span></div>${names.length?`<div class="field"><label>Übung auswählen</label><select id="chartSelect">${names.map(n=>`<option value="${esc(n)}" ${n===chartExercise?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="chart-summary"><div class="chart-stat"><span>Letzter Wert · geschätztes 1RM</span><strong>${latest?latest.toFixed(1)+' kg':'–'}</strong></div><div class="chart-stat"><span>Persönlicher Bestwert</span><strong>${record?record.toFixed(1)+' kg':'–'}</strong></div></div><div class="chart-wrap"><canvas id="progressChart" width="720" height="300" role="img" aria-label="Verlauf des geschätzten Ein-Wiederholungs-Maximums"></canvas></div><div class="metric">Geschätztes 1RM (Epley) aus dem jeweils stärksten Satz pro Training. Jeder Punkt entspricht einer abgeschlossenen Einheit.</div>`:'<p class="muted">Nach abgeschlossenen Trainings erscheint hier dein Verlauf.</p>'}</div><div class="card"><h3>Geschätzte Bestleistung je Übung</h3>${best.map(x=>`<div class="between" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>${esc(x.n)}</span><b>${x.v.toFixed(1)} kg</b></div>`).join('')||'<p class="muted">Noch keine Werte vorhanden.</p>'}</div><div class="card"><h3>Körpergewicht</h3><form id="bwform" class="field"><input name="weight" type="number" step=".1" placeholder="Gewicht in kg" required><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"><button class="primary">Speichern</button></form>${db.bodyweight.slice().sort((x,y)=>y.date.localeCompare(x.date)).map(x=>`<div class="between"><span>${x.date}</span><b>${x.weight} kg</b></div>`).join('')}</div><div class="actions"><button data-export>Daten exportieren</button><button data-import>Backup importieren</button></div><div class="card"><div class="between"><h3>Datensicherung</h3><span class="pill">Automatisch aktiv</span></div><p class="muted">CFTS legt bei gespeicherten Änderungen automatisch bis zu 7 lokale Sicherungsstände an. Zusätzlich kannst du jederzeit eine Datei exportieren.</p><div class="actions"><button class="primary" data-backup-now>Backup jetzt herunterladen</button><button data-restore-backup>Lokales Backup wiederherstellen</button></div><p class="metric">Lokale Backups liegen nur in diesem Browser auf diesem Gerät. Für Handywechsel oder bei gelöschten Browserdaten brauchst du zusätzlich einen extern gespeicherten Export.</p></div>`;
  if(names.length)drawChart(chartExercise);
}
function drawChart(name){
  const c=$('#progressChart');if(!c)return;
  const ctx=c.getContext('2d'),w=c.width,h=c.height;
  const data=db.history.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(item=>({date:item.date,v:Math.max(0,...item.exercises.filter(e=>e.name===name).flatMap(e=>e.sets.map(s=>epley(+s.weight,+s.reps))))})).filter(x=>x.v>0);
  ctx.clearRect(0,0,w,h);
  const muted='#aab8ad',green='#8ac49a',grid='#304237';
  if(!data.length){ctx.fillStyle=muted;ctx.font='15px system-ui';ctx.fillText('Noch keine Daten für diese Übung',24,42);return}
  const left=58,right=18,top=20,bottom=48,plotW=w-left-right,plotH=h-top-bottom;
  const min=Math.max(0,Math.floor(Math.min(...data.map(x=>x.v))*.85/5)*5),max=Math.max(min+5,Math.ceil(Math.max(...data.map(x=>x.v))*1.12/5)*5);
  const px=i=>left+(data.length===1?plotW/2:i*plotW/(data.length-1));
  const py=v=>top+plotH-(v-min)/(max-min)*plotH;
  ctx.font='12px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';ctx.strokeStyle=grid;ctx.lineWidth=1;
  for(let k=0;k<=4;k++){const val=min+(max-min)*k/4,y=py(val);ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke();ctx.fillStyle=muted;ctx.fillText(val.toFixed(0),left-10,y)}
  const points=data.map((d,i)=>({x:px(i),y:py(d.v),...d}));
  const gradient=ctx.createLinearGradient(0,top,0,top+plotH);gradient.addColorStop(0,'rgba(138,196,154,.28)');gradient.addColorStop(1,'rgba(138,196,154,0)');
  ctx.beginPath();ctx.moveTo(points[0].x,top+plotH);points.forEach(p=>ctx.lineTo(p.x,p.y));ctx.lineTo(points.at(-1).x,top+plotH);ctx.closePath();ctx.fillStyle=gradient;ctx.fill();
  ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle=green;ctx.lineWidth=3;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
  points.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fillStyle=green;ctx.fill();ctx.strokeStyle='#19221c';ctx.lineWidth=2;ctx.stroke()});
  ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillStyle=muted;ctx.font='11px system-ui';
  const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
  ctx.fillText(fmt(data[0].date),left,h-17);
  const lastLabel=fmt(data.at(-1).date);ctx.textAlign='right';ctx.fillText(lastLabel,w-right,h-17);
  ctx.save();ctx.translate(15,top+plotH/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText('Geschätztes 1RM (kg)',0,0);ctx.restore();
}
function lastSets(name){for(let h of [...db.history].sort((a,b)=>b.date.localeCompare(a.date))){let e=h.exercises.find(x=>x.name===name);if(e&&e.sets?.length)return e.sets.map(s=>({weight:+s.weight||0,reps:+s.reps||10,done:false}))}return null}
function addExercise(name){let type=typeFor(name),old=lastSets(name);planDraft.push({name,type,sets:old||newEx(name,type).sets});}

function templatePicker(){
  let items=db.templates||[];
  modal('Gespeicherte Trainingstage',`${items.length?items.map((t,i)=>`<div class="card between"><div><b>${esc(t.name)}</b><div class="muted">${t.exercises.length} Übungen</div></div><div class="actions"><button data-use-template="${i}">Einfügen</button><button class="danger" data-delete-template="${i}">Löschen</button></div></div>`).join(''):'<div class="empty">Noch keine Trainingstage gespeichert.</div>'}`);
}
function exercisePicker(){let html=`<div class="field"><label>Übung suchen</label><input id="exerciseSearch" placeholder="z. B. Rudern, Trizeps …"></div><div id="exerciseChoices">${Object.entries(catalog).map(([g,arr])=>`<div class="group-title">${g}</div>${arr.map(n=>`<div class="exercise-option" data-exname="${esc(n)}"><span>${esc(n)}</span><button type="button" data-pick="${esc(n)}">＋</button></div>`).join('')}`).join('')}<div class="group-title">Eigene Übung</div><button type="button" data-custom>＋ Eigene Übung erstellen</button></div>`;modal('Übung auswählen',html)}
function openPlan(p){editingPlan=p?.id||null;planDraft=JSON.parse(JSON.stringify(p?.exercises||[]));let html=`<form id="planform"><div class="field"><label>Trainingsname</label><input name="name" required value="${esc(p?.name||'Krafttraining')}"></div><div class="field"><label>Datum</label><input name="date" type="date" required value="${p?.date||selectedDay||new Date().toISOString().slice(0,10)}"></div><div class="actions"><button type="button" data-picker>＋ Übung hinzufügen</button><button type="button" data-save-template>Trainingstag speichern</button><button type="button" data-insert-template>Gespeicherten Trainingstag einfügen</button></div><div id="exerciseList">${planDraft.map((e,i)=>`<div class="exercise between"><div><b>${esc(e.name)}</b><div class="muted">${e.sets.length} Sätze · ${esc(e.type)}</div></div><button type="button" data-rem="${i}">Entfernen</button></div>`).join('')}</div><div class="field"><label><input type="checkbox" name="repeat" ${p?.repeat?'checked':''}> Wöchentlich wiederholen</label></div><div id="repeatBox" class="${p?.repeat?'':'hidden'}"><label>Wochentage</label><div class="row">${['Mo','Di','Mi','Do','Fr','Sa','So'].map((d,i)=>`<label><input type="checkbox" name="days" value="${i}" ${p?.days?.includes(i)?'checked':''}>${d}</label>`).join('')}</div><div class="field"><label>Wiederholen bis (optional)</label><input type="date" name="until" value="${p?.until||''}"></div></div><div class="actions"><button class="primary">Speichern</button>${p?`<button type="button" class="danger" data-delete="${p.id}">Löschen</button>`:''}</div></form>`;modal(p?'Geplantes Training bearbeiten':'Training planen',html)}
function workoutScreen(){let w=active;modal('Training läuft',`<p class="metric">Vorwerte aus deinem letzten abgeschlossenen Training wurden übernommen. Du kannst alle Werte hier anpassen.</p><div class="field"><label>Name</label><input id="liveName" value="${esc(w.name)}"></div>${w.exercises.map((e,i)=>{return `<div class="exercise"><b>${esc(e.name)}</b><div class="setlabels"><span></span><span class="weight-label">Gewicht (kg)</span><span class="reps-label">Wiederholungen</span><span class="done-label">✓</span></div>${e.sets.map((s,j)=>`<div class="setrow"><span>${j+1}.</span><input aria-label="Gewicht kg" type="number" step="${step(e)}" value="${s.weight}" data-w="${i},${j},weight"><button class="mini" data-adjust="weight,-1,${i},${j}">−</button><button class="mini" data-adjust="weight,1,${i},${j}">＋</button><input aria-label="Wiederholungen" type="number" value="${s.reps}" data-w="${i},${j},reps"><button class="mini" data-repstep="-1,${i},${j}">−</button><button class="mini" data-repstep="1,${i},${j}">＋</button><input type="checkbox" ${s.done?'checked':''} data-check="${i},${j}"></div>`).join('')}<div class="actions"><button data-addset="${i}">＋ Satz</button><button data-remset="${i}">− Satz</button></div></div>`}).join('')}<div class="actions"><button class="primary" data-finish>Training abschließen</button><button data-close>Schließen</button></div>`)}
function last(name){let s=lastSets(name);return s?s.map(x=>`${x.weight} kg × ${x.reps}`).join(', '):''}
function editHistory(h){modal('Abgeschlossenes Training bearbeiten',`<div class="field"><label>Name</label><input id="hn" value="${esc(h.name)}"></div><div class="field"><label>Datum</label><input id="hd" type="date" value="${h.date}"></div>${h.exercises.map((e,i)=>`<div class="exercise"><div class="between"><b>${esc(e.name)}</b><button type="button" class="smallbtn danger" data-remove-history-ex="${i},${h.id}">Übung löschen</button></div>${e.sets.map((s,j)=>`<div class="history-setlabels"><span>${j+1}</span><span>Gewicht (kg)</span><span>Wiederholungen</span></div><div class="history-setrow"><span>${j+1}</span><input type="number" step=".5" value="${s.weight}" data-h="${i},${j},weight"><input type="number" value="${s.reps}" data-h="${i},${j},reps"></div>`).join('')}</div>`).join('')}<div class="actions"><button type="button" data-add-history-ex="${h.id}">＋ Übung hinzufügen</button><button class="primary" data-saveh="${h.id}">Speichern</button><button class="danger" data-deleteh="${h.id}">Training löschen</button></div>`)}
function downloadJson(data,filename){let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportData(){downloadJson(db,'cfts-backup.json')}
function exportFullBackup(){downloadJson({app:'CFTS',version:1,createdAt:new Date().toISOString(),data:db},'cfts-backup-'+new Date().toISOString().slice(0,10)+'.json')}
function getAutoBackups(){try{let b=JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]');return Array.isArray(b)?b:[]}catch{return []}}
function restorePicker(){
  const backups=getAutoBackups();
  if(!backups.length){modal('Backup wiederherstellen','<p class="muted">Es gibt noch keine automatischen Sicherungsstände. Sie entstehen nach der nächsten gespeicherten Änderung.</p>');return}
  modal('Lokales Backup wiederherstellen',`<p class="muted">Wähle einen Sicherungsstand. Deine aktuellen Daten werden vor dem Wiederherstellen automatisch gesichert.</p><div class="field"><label>Sicherungsstand</label><select id="backupChoice">${backups.map((b,i)=>`<option value="${i}">${new Date(b.createdAt).toLocaleString('de-DE')} · Sicherung ${i+1}</option>`).join('')}</select></div><button class="primary" data-confirm-restore>Ausgewählten Stand wiederherstellen</button>`);
}
function restoreAutoBackup(){
  const backups=getAutoBackups(),b=backups[+($('#backupChoice')?.value||0)];
  if(!b)return;
  if(!confirm('Möchtest du diesen Stand wiederherstellen? Deine aktuellen Trainingsdaten werden dadurch ersetzt.'))return;
  try{const restored=JSON.parse(b.data);if(!restored||!Array.isArray(restored.planned)||!Array.isArray(restored.history))throw Error('Ungültiges Backup');
    save();
    db=restored;for(const k of ['planned','history','templates','bodyweight'])if(!Array.isArray(db[k]))db[k]=[];
    save();close();render();alert('Backup wurde wiederhergestellt.');
  }catch(e){alert('Das Backup konnte nicht wiederhergestellt werden.');}
}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.close!==undefined){close();return}if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.new!==undefined)openPlan();if(b.dataset.newday)openPlan({date:b.dataset.newday});if(b.dataset.edit)openPlan(db.planned.find(p=>p.id===b.dataset.edit));if(b.dataset.history)editHistory(db.history.find(h=>h.id===b.dataset.history));if(b.dataset.month){month=new Date(month.getFullYear(),month.getMonth()+Number(b.dataset.month),1);selectedDay=`${month.getFullYear()}-${String(month.getMonth()+1).padStart(2,'0')}-01`;render()}if(b.dataset.today!==undefined){let now=new Date();month=new Date(now.getFullYear(),now.getMonth(),1);selectedDay=now.toISOString().slice(0,10);render()}if(b.dataset.day){selectedDay=b.dataset.day;render()}if(b.dataset.start){let p=db.planned.find(x=>x.id===b.dataset.start);active=JSON.parse(JSON.stringify(p));active.exercises=active.exercises.map(ex=>{let previous=lastSets(ex.name);return previous?{...ex,sets:previous.map(s=>({...s,done:false}))}:ex});workoutScreen()}if(b.dataset.picker!==undefined)exercisePicker();
if(b.dataset.saveTemplate!==undefined){
 let f=$('#planform');if(!planDraft.length){alert('Bitte zuerst Übungen hinzufügen.');return}
 modal('Trainingstag speichern',`<form id="templateform"><div class="field"><label>Name des Trainingstags</label><input name="name" required placeholder="z. B. Push-Tag"></div><button class="primary">Speichern</button></form>`);
}
if(b.dataset.insertTemplate!==undefined)templatePicker();
if(b.dataset.useTemplate!==undefined){let t=db.templates[+b.dataset.useTemplate];if(t){planDraft=planDraft.concat(JSON.parse(JSON.stringify(t.exercises)));let f={name:$('#planform')?.name?.value||'Krafttraining',date:$('#planform')?.date?.value||selectedDay,exercises:planDraft};openPlan(f)}}
if(b.dataset.deleteTemplate!==undefined){db.templates.splice(+b.dataset.deleteTemplate,1);save();templatePicker()}
if(b.dataset.addHistoryEx){let h=db.history.find(x=>x.id===b.dataset.addHistoryEx);active={historyId:h.id};modal('Übung zum Training hinzufügen',`<div class="field"><input id="historyExerciseSearch" placeholder="Übung suchen"></div>${Object.entries(catalog).map(([g,arr])=>`<div class="group-title">${g}</div>${arr.map(n=>`<div class="exercise-option"><span>${esc(n)}</span><button data-add-history-name="${esc(n)}" data-history-id="${h.id}">＋</button></div>`).join('')}`).join('')}`)}
if(b.dataset.addHistoryName){let h=db.history.find(x=>x.id===b.dataset.historyId);if(h){let n=b.dataset.addHistoryName;if(!h.exercises.some(x=>x.name===n))h.exercises.push({name:n,type:typeFor(n),sets:lastSets(n)||newEx(n,typeFor(n)).sets});save();editHistory(h)}}
if(b.dataset.removeHistoryEx){let [i,id]=b.dataset.removeHistoryEx.split(',');let h=db.history.find(x=>x.id===id);if(h){if(h.exercises.length<=1){alert('Mindestens eine Übung muss erhalten bleiben.');return}h.exercises.splice(+i,1);save();editHistory(h)}}
if(b.dataset.pick){let n=b.dataset.pick;addExercise(n);let p={name:$('#planform')?.name?.value||'Krafttraining',date:$('#planform')?.date?.value||selectedDay,exercises:planDraft};openPlan(p)}if(b.dataset.custom!==undefined){modal('Eigene Übung hinzufügen',`<form id="customform"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Gerätetyp</label><select name="type"><option>Maschine</option><option>Kurzhantel</option><option>Langhantel</option><option>Kabel</option><option>Körpergewicht</option></select></div><button class="primary">Hinzufügen</button></form>`)}if(b.dataset.rem!==undefined){let f=$('#planform');openPlan({name:f.name.value,date:f.date.value,exercises:planDraft.filter((_,i)=>i!==+b.dataset.rem)})}if(b.dataset.delete){db.planned=db.planned.filter(p=>p.id!==b.dataset.delete);save();close();render()}if(b.dataset.addset!==undefined){let i=+b.dataset.addset,s=active.exercises[i].sets.at(-1);active.exercises[i].sets.push({weight:s.weight,reps:s.reps,done:false});workoutScreen()}if(b.dataset.remset!==undefined){let i=+b.dataset.remset;if(active.exercises[i].sets.length>1)active.exercises[i].sets.pop();workoutScreen()}if(b.dataset.adjust){let [kind,delta,i,j]=b.dataset.adjust.split(',');let s=active.exercises[+i].sets[+j],ex=active.exercises[+i];s.weight=Math.max(0,+(s.weight+Number(delta)*step(ex)).toFixed(2));workoutScreen()}if(b.dataset.repstep){let [delta,i,j]=b.dataset.repstep.split(',');active.exercises[+i].sets[+j].reps=Math.max(0,(+active.exercises[+i].sets[+j].reps||0)+Number(delta));workoutScreen()}if(b.dataset.finish!==undefined){active.name=$('#liveName').value;active.date=active.date||new Date().toISOString().slice(0,10);db.history.push({...active,id:crypto.randomUUID()});db.planned=db.planned.filter(p=>p.id!==active.id);save();close();tab='home';render()}if(b.dataset.saveh){let h=db.history.find(x=>x.id===b.dataset.saveh);h.name=$('#hn').value;h.date=$('#hd').value;document.querySelectorAll('[data-h]').forEach(x=>{let [i,j,k]=x.dataset.h.split(',');h.exercises[+i].sets[+j][k]=+x.value});save();close();render()}if(b.dataset.deleteh){db.history=db.history.filter(h=>h.id!==b.dataset.deleteh);save();close();render()}if(b.dataset.move){let p=db.planned.find(x=>x.id===b.dataset.move);modal('Training verschieben',`<div class="field"><label>Neues Datum</label><input type="date" id="moveDate" value="${p.date}"></div><button class="primary" data-confirmmove="${p.id}">Verschieben</button>`)}if(b.dataset.confirmmove){let p=db.planned.find(x=>x.id===b.dataset.confirmmove);p.date=$('#moveDate').value;save();close();render()}if(b.dataset.export!==undefined)exportData();if(b.dataset.backupNow!==undefined)exportFullBackup();if(b.dataset.restoreBackup!==undefined)restorePicker();if(b.dataset.confirmRestore!==undefined)restoreAutoBackup();if(b.dataset.import!==undefined)modal('Backup importieren','<p>Wähle eine zuvor exportierte CFTS- oder Liftlog-JSON-Datei.</p><input type="file" id="importFile" accept=".json,application/json">')});
document.addEventListener('change',e=>{if(e.target.id==='exerciseSearch'){let q=e.target.value.toLowerCase();document.querySelectorAll('[data-exname]').forEach(x=>x.classList.toggle('hidden',!x.dataset.exname.toLowerCase().includes(q)));document.querySelectorAll('.group-title').forEach(x=>{let next=x.nextElementSibling,any=false;while(next&& !next.classList.contains('group-title')){if(next.matches('[data-exname]')&&!next.classList.contains('hidden'))any=true;next=next.nextElementSibling}x.classList.toggle('hidden',!any)})}if(e.target.id==='chartSelect'){chartExercise=e.target.value;drawChart(chartExercise)}if(e.target.name==='repeat')$('#repeatBox').classList.toggle('hidden',!e.target.checked);if(e.target.dataset.check){let [i,j]=e.target.dataset.check.split(',').map(Number);active.exercises[i].sets[j].done=e.target.checked}if(e.target.id==='importFile'&&e.target.files[0]){let r=new FileReader();r.onload=()=>{try{let parsed=JSON.parse(r.result),d=parsed.data||parsed;if(!Array.isArray(d.planned)||!Array.isArray(d.history))throw 0;const merge=(current,incoming)=>{const out=[...current],ids=new Set(current.map(x=>x.id).filter(Boolean));for(const item of incoming||[]){if(item.id&&ids.has(item.id))continue;out.push(item);if(item.id)ids.add(item.id)}return out};for(const k of ['planned','history','templates','bodyweight'])db[k]=merge(db[k]||[],d[k]||[]);save();close();render()}catch{alert('Backup konnte nicht gelesen werden.')}};r.readAsText(e.target.files[0])}});
document.addEventListener('input',e=>{if(e.target.dataset.w){let [i,j,k]=e.target.dataset.w.split(',');active.exercises[+i].sets[+j][k]=+e.target.value}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='templateform'){let name=e.target.name.value.trim();db.templates.push({id:crypto.randomUUID(),name,exercises:JSON.parse(JSON.stringify(planDraft))});save();let f={name:$('#planform')?.name?.value||'Krafttraining',date:$('#planform')?.date?.value||selectedDay,exercises:planDraft};openPlan(f)}if(e.target.id==='planform'){let f=e.target;if(!planDraft.length){alert('Bitte mindestens eine Übung hinzufügen.');return}let repeat=f.repeat.checked,days=[...f.querySelectorAll('[name=days]:checked')].map(x=>+x.value);if(repeat&&!days.length){alert('Bitte Wochentage auswählen.');return}let id=editingPlan||crypto.randomUUID(),p={id,name:f.name.value,date:f.date.value,exercises:planDraft,repeat,days,until:f.until?.value||''};if(editingPlan)db.planned=db.planned.map(x=>x.id===id?p:x);else db.planned.push(p);if(repeat){let d=new Date(p.date+'T12:00:00'),end=p.until?new Date(p.until+'T12:00:00'):new Date(d.getTime()+90*86400000);for(let n=0;n<91&&d<=end;n++,d.setDate(d.getDate()+1)){let dt=d.toISOString().slice(0,10);if(days.includes((d.getDay()+6)%7)&&dt!==p.date&&!db.planned.some(x=>x.series===id&&x.date===dt))db.planned.push({...JSON.parse(JSON.stringify(p)),id:crypto.randomUUID(),date:dt,series:id})}}save();close();render()}if(e.target.id==='customform'){let name=e.target.name.value,type=e.target.type.value;planDraft.push({name,type,sets:lastSets(name)||newEx(name,type).sets});let p={name:'Krafttraining',date:selectedDay,exercises:planDraft};openPlan(p)}if(e.target.id==='bwform'){db.bodyweight.push({weight:+e.target.weight.value,date:e.target.date.value});save();render()}});
document.addEventListener('dragstart',e=>{let el=e.target.closest('[data-dragplan]');if(el)e.dataTransfer.setData('text/plain',el.dataset.dragplan)});
document.addEventListener('dragover',e=>{let d=e.target.closest('[data-dropday]');if(d){e.preventDefault();d.classList.add('dragover')}});
document.addEventListener('dragleave',e=>{let d=e.target.closest('[data-dropday]');if(d)d.classList.remove('dragover')});
document.addEventListener('drop',e=>{let d=e.target.closest('[data-dropday]');if(!d)return;e.preventDefault();let id=e.dataTransfer.getData('text/plain'),p=db.planned.find(x=>x.id===id);if(p){p.date=d.dataset.dropday;selectedDay=p.date;save();render()}});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();

</script></body></html>
